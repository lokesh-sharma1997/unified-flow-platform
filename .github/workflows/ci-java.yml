name: Java CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/**'
      - 'shared/**'
      - 'pom.xml'
      - '.github/workflows/ci-java.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/**'
      - 'shared/**'
      - 'pom.xml'

jobs:
  build:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ufp
          POSTGRES_PASSWORD: ufp
          POSTGRES_DB: ufp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test all modules
        run: mvn clean verify --batch-mode --no-transfer-progress
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ufp_test
          SPRING_DATASOURCE_USERNAME: ufp
          SPRING_DATASOURCE_PASSWORD: ufp

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: '**/target/surefire-reports/*.xml'
          retention-days: 7

      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: java-jars
          path: '**/target/*.jar'
          retention-days: 7
