name: Docker Build

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'shared/**'
      - 'frontend/**'
      - 'go-services/**'
      - '**/Dockerfile'
      - '.github/workflows/ci-docker.yml'

jobs:
  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: ufp-gateway
            context: services/ufp-gateway
          - name: ufp-workflow
            context: services/ufp-workflow
          - name: ufp-pipeline
            context: services/ufp-pipeline
          - name: ufp-mlops
            context: services/ufp-mlops
          - name: ufp-agent
            context: services/ufp-agent
          - name: ufp-governance
            context: services/ufp-governance

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.context }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service.name }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
