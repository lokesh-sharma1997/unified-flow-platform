spring:
  application:
    name: ufp-governance
  datasource:
    url: jdbc:postgresql://localhost:5432/ufp_governance
    username: ufp
    password: ufp
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  kafka:
    bootstrap-servers: localhost:9092

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.ufp: DEBUG
